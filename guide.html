<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FollowOp Guide">
<meta name="theme-color" content="#0F1F3D">
<meta name="description" content="FollowOp Getting Started Guide — Learn how to use FollowOp to capture contacts, manage clients/referrals, and generate reports.">
<title>FollowOp — Getting Started Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1F3D;--blue:#3B82F6;--text:#1F2937;--mid:#6B7280;--light:#9CA3AF;--border:#E5E7EB;--bg:#F9FAFB;--amber:#F59E0B;--green:#10B981;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;}
.container{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
.header{text-align:center;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.logo{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--navy);margin-bottom:4px;}
.logo em{font-style:italic;color:var(--blue);}
.subtitle{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--light);font-weight:500;}
.version-badge{display:inline-block;padding:3px 10px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;background:rgba(59,130,246,0.1);color:var(--blue);border:1px solid rgba(59,130,246,0.2);border-radius:12px;margin-top:8px;}
.tab-bar{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;}
.tab-btn{padding:6px 14px;font-size:12px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--mid);border-radius:20px;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.tab-btn:hover{border-color:var(--blue);color:var(--blue);}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.section{margin-bottom:24px;display:none;}
.section.active{display:block;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.item{margin-bottom:16px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.item-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;}
.item-body{font-size:13px;color:var(--mid);line-height:1.7;}
.item-body a{color:var(--blue);text-decoration:none;}
.item-body a:hover{text-decoration:underline;}
.badge{display:inline-block;padding:2px 8px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;margin-right:4px;margin-bottom:4px;border-radius:4px;}
.badge-hot{background:rgba(59,130,246,0.1);color:var(--blue);border:1px solid rgba(59,130,246,0.2);}
.badge-follow{background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-recommend{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-intel{background:rgba(107,114,128,0.1);color:var(--mid);border:1px solid rgba(107,114,128,0.2);}
.back-link{display:inline-block;color:var(--blue);font-size:13px;text-decoration:none;margin-bottom:16px;}
.back-link:hover{text-decoration:underline;}
.new-tag{display:inline-block;padding:1px 6px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.2);border-radius:8px;margin-left:6px;vertical-align:middle;}
@media(max-width:480px){.container{padding:16px 12px 32px;}.logo{font-size:26px;}.section-title{font-size:20px;}}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">← Back to FollowOp</a>
  <div class="header">
    <div class="logo">Follow<em>Op</em></div>
    <div class="subtitle">Getting Started Guide</div>
    <div class="version-badge">v1.3</div>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div id="sections-container"></div>
</div>
<script>
(function(){
  var NEW_SECTIONS = ['whats-new'];
  var NEW_ITEMS = [
    'Calendar view', 'Photo upload', 'Social links', 'Editable event', 'Editable clients',
    'Enhanced CSV', 'Brief export', 'Back buttons', 'Research from contact',
    'Editing and deleting events', 'Editing and deleting clients', 'Social links on contacts',
    'Photo upload for contacts', 'Calendar view for events', 'Brief export options'
  ];

  function isNewItem(title) {
    return NEW_ITEMS.some(function(n){ return title.indexOf(n) > -1; });
  }

  fetch('/guide-content.json')
    .then(function(r){ return r.json(); })
    .then(function(data){ render(data); })
    .catch(function(e){ document.getElementById('sections-container').innerHTML = '<p style="color:var(--mid);text-align:center;padding:40px 0;">Could not load guide content. Please try again later.</p>'; });

  function render(data) {
    var tabBar = document.getElementById('tab-bar');
    var container = document.getElementById('sections-container');
    var tabs = [];
    var sections = [];

    data.sections.forEach(function(sec, i) {
      var isNew = NEW_SECTIONS.indexOf(sec.id) > -1;
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.textContent = sec.title.replace(/ — .*/, '');
      if (isNew) {
        var tag = document.createElement('span');
        tag.className = 'new-tag';
        tag.textContent = 'NEW';
        btn.appendChild(tag);
      }
      btn.setAttribute('data-section', sec.id);
      btn.onclick = function() {
        document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('section-' + sec.id).classList.add('active');
      };
      tabBar.appendChild(btn);

      var div = document.createElement('div');
      div.className = 'section' + (i === 0 ? ' active' : '');
      div.id = 'section-' + sec.id;

      var h2 = document.createElement('div');
      h2.className = 'section-title';
      h2.textContent = sec.title;
      div.appendChild(h2);

      sec.items.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'item';
        var titleEl = document.createElement('div');
        titleEl.className = 'item-title';
        titleEl.textContent = item.title;
        if (isNewItem(item.title)) {
          var nt = document.createElement('span');
          nt.className = 'new-tag';
          nt.textContent = 'NEW';
          titleEl.appendChild(nt);
        }
        card.appendChild(titleEl);
        var bodyEl = document.createElement('div');
        bodyEl.className = 'item-body';
        bodyEl.innerHTML = item.body.replace(/(lexie@asheemberco\.com)/g, '<a href="mailto:$1">$1</a>').replace(/(asheco\.now\.site\/ceo)/g, '<a href="https://$1" target="_blank">$1</a>');
        card.appendChild(bodyEl);
        div.appendChild(card);
      });

      container.appendChild(div);
    });
  }
})();
</script>
</body>
</html>
